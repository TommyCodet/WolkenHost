name: WolkeHost CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Python syntax
        run: python -m compileall -q .
      - name: Validate egg JSON
        run: python -m json.tool eggs/pterodactyl/egg-wolkehost-afk-bot.json > /dev/null
      - name: Validate configuration mapping
        run: python -m unittest discover -s tests
      - name: Validate Node syntax
        run: node --check bot.js
