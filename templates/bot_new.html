{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">NEUER BOT</p><h1>AFK-Bot erstellen</h1><p class="muted">Die Felder entsprechen den Einstellungen des AFK-Bot-Eggs.</p></div></div><form class="card formcard" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Server-Adresse <small>SERVER_HOST</small></label><input name="host" required maxlength="253" placeholder="play.beispiel.de"><label>Server-Port <small>SERVER_PORT</small></label><input name="port" type="number" min="1" max="65535" value="25565" required><label>Minecraft-Version <small>MC_VERSION</small></label><select name="version"><option value="auto">Automatisch</option><option value="1.21.1">1.21.1</option><option value="1.20.4">1.20.4</option><option value="1.19.4">1.19.4</option></select><label>AFK-Befehl <small>AFK_ENABLED / AFK_COMMAND</small></label><label class="check"><input type="checkbox" name="command_afk" checked> Beim Verbinden <code>/afk on</code> senden</label><label>Automatische Wiederverbindung <small>AUTO_RECONNECT</small></label><label class="check"><input type="checkbox" name="autoreconnect" checked> Bei Verbindungsabbruch neu verbinden</label><label>Wartezeit <small>RECONNECT_DELAY</small></label><input value="10 Sekunden (fest)" disabled><button class="primary">Bot erstellen</button></form>{% endblock %}
