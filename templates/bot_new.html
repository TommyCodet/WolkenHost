{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">NEUER BOT</p><h1>AFK-Bot erstellen</h1><p class="muted">Verbinde deinen Bot mit einem Minecraft-Java-Server.</p></div></div><form class="card formcard" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Server-Adresse <small>SERVER_HOST</small></label><input name="host" required maxlength="253" placeholder="play.beispiel.de"><label>Server-Port <small>SERVER_PORT</small></label><input name="port" type="number" min="1" max="65535" value="25565" required><label>Minecraft-Version <small>MC_VERSION</small></label><select name="version"><option value="auto">Automatisch</option><option value="1.21.1">1.21.1</option><option value="1.20.4">1.20.4</option><option value="1.19.4">1.19.4</option></select><label>AFK-Befehl</label><label class="check"><input type="checkbox" name="command_afk" checked> Nach dem Login <code>/afk on</code> senden</label><label>Eigene Startbefehle <small>Optional · einer pro Zeile · max. 10</small></label><textarea name="startup_commands" rows="4" maxlength="1010" placeholder="/spawn\n/msg Spieler Hallo"></textarea><p class="small muted">Die Befehle werden nach dem Login im Spiel-Chat gesendet, mit kurzem Abstand. Du kannst sie auch leer lassen.</p><label>Automatische Wiederverbindung</label><label class="check"><input type="checkbox" name="autoreconnect" checked> Bei Verbindungsabbruch neu verbinden</label><button class="primary">Bot erstellen</button></form>{% endblock %}
