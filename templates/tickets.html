{% extends "base.html" %}{% block content %}<div class="heading"><div><p class="eyebrow">HILFE</p><h1>Support-Tickets</h1></div></div><form class="card formcard" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Betreff</label><input name="subject" required maxlength="120"><label>Nachricht</label><textarea name="message" rows="4" required></textarea><button class="primary">Ticket senden</button></form>{% for t in tickets %}<article class="card ticket"><b>{{ t.subject }}</b><span class="pill">{{ t.status }}</span><p>{{ t.message }}</p>{% if t.reply %}<div class="reply"><b>Support-Antwort</b><p>{{ t.reply }}</p></div>{% endif %}</article>{% else %}<p class="muted">Noch keine Tickets.</p>{% endfor %}{% endblock %}
